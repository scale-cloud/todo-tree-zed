id = "todo-tree"
name = "Todo Tree"
version = "0.1.0"
schema_version = 1
authors = ["Gruntfuggly", "Jordan Rickman"]
description = "Find TODO, FIXME, etc. comment tags across your project and list them in the diagnostics panel and symbol search."
