[package]
name = "todo-tree-ls"
version = "0.1.0"
edition = "2021"
description = "Language server that finds TODO, FIXME, etc. comment tags in a workspace (powers the Todo Tree Zed extension)"
license = "MIT"
repository = "https://github.com/JordanRickman/todo-tree"

[[bin]]
name = "todo-tree-ls"
path = "src/main.rs"

[dependencies]
crossbeam-channel = "0.5"
globset = "0.4"
ignore = "0.4"
lsp-server = "0.10"
lsp-types = "0.95"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
